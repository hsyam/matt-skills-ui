<!doctype html>
<!--
  PROTOTYPE, throwaway. Same Matt Skills UI feature set (from the atlas draft), four
  radically different looks. Switch with ?variant=A|B|C|D, the floating bar,
  or Alt+← / Alt+→. Each theme also changes layout and how the chart is drawn.
    A  Swiss     strict grid · one red · big grotesk · orthogonal graph
    B  Terminal  warm TUI panes · tmux status bar · box nodes, step edges
    C  Transit   efforts as metro lines · tickets as stations · 45° routes
    D  Toybox    neo-brutalist · chunky borders · hard shadows · stickers
  Keys: 1/2/3 views · ⌘K/Ctrl-K palette · ] toggle details · Esc.
  Mock data only; buttons mutate it in memory. Nothing is persisted.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matt Skills UI Themes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ===================== BASE (theme-agnostic, token driven) ===================== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:var(--fs,13.5px)/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--font-m)} .muted{color:var(--fg2)} .faint{color:var(--fg3)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.gl{text-decoration:underline dotted var(--fg3);text-underline-offset:3px;cursor:help}

.app{display:grid;height:100vh;position:relative}
.mast{grid-area:mast;display:flex;align-items:center;gap:16px;padding:0 18px;min-width:0;white-space:nowrap}
.mast .sp{flex:1}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--fg2);font-size:12.5px}
.meta{display:flex;gap:14px;color:var(--fg2);font-size:12px}
.seek{display:flex;align-items:center;gap:10px;min-width:280px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r);color:var(--fg3);font-size:12.5px;background:var(--bg)}
.kbd{font-family:var(--font-m);font-size:10.5px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--fg2);margin-left:auto}
.await{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:var(--r);background:var(--s-you);color:var(--you-fg,#fff);font-weight:600;font-size:12px}
.live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--s-done);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.3}}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r);color:var(--fg2)}
.iconbtn:hover{background:var(--bg3)}

.nav{grid-area:nav;overflow:auto;padding:14px 14px 80px}
.setup{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:4px 2px 14px;cursor:pointer}
.setup b{display:block;font-weight:700}
.setup small{color:var(--fg2);font-size:11.5px}
.nav h6{margin:18px 0 6px}
.place{display:block;width:100%;text-align:left;padding:7px 8px 8px;border-radius:var(--r);position:relative}
.place:hover{background:var(--bg3)}
.place.on{background:var(--bg3)}
.place .n{font-weight:600;font-size:14px;line-height:1.2;display:flex;align-items:center;gap:8px}
.place .k{font-size:11px;color:var(--fg3);display:flex;gap:8px;align-items:center;margin-top:5px}
.prog{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--s-done)}
.roundel{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.link{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:var(--r);color:var(--fg2);text-align:left}
.link:hover{background:var(--bg3);color:var(--fg)}
.link.on{color:var(--fg);background:var(--bg3)}
.link .g{width:16px;text-align:center;color:var(--fg3)}
.link .c{margin-left:auto;font-family:var(--font-m);font-size:11px}
.link .c.hot{color:var(--s-you);font-weight:700}

.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.head{padding:16px 24px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:start}
.crumb{font-size:11.5px;color:var(--fg3);display:flex;gap:8px;align-items:center}
.head h1{font-family:var(--font-d);font-weight:800;font-size:clamp(24px,2.4vw,32px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 6px}
.head h1 em{font-style:normal;font-weight:400;color:var(--fg2)}
.head .gist{color:var(--fg2);max-width:62ch;margin:0}
.next{grid-row:span 2;width:360px;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg)}
.next .t{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.next p{margin:0 0 9px;color:var(--fg2);font-size:12.5px}
.route{display:flex;align-items:center;margin:10px 0 0;overflow-x:auto;grid-column:1/-1}
.stn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:78px;position:relative}
.stn::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stn:first-child::before{display:none}
.stn .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);z-index:1}
.stn.past .dot{background:var(--fg2);border-color:var(--fg2)} .stn.past::before,.stn.cur::before{background:var(--fg2)}
.stn.cur .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--accent)}
.stn b{font-size:11.5px;font-weight:600;text-transform:capitalize}
.stn.fut b{color:var(--fg3);font-weight:500}
.views{display:flex;align-items:flex-end;gap:2px;padding:0 24px;margin-top:10px;border-bottom:1px solid var(--line2)}
.views button{padding:7px 14px 6px;border:1px solid transparent;border-bottom:0;border-radius:var(--r) var(--r) 0 0;color:var(--fg2);display:flex;gap:7px;align-items:center;margin-bottom:-1px}
.views button.on{background:var(--bg);border-color:var(--line2);color:var(--fg);font-weight:600}
.views .right{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{padding:3px 10px;font-size:11.5px;color:var(--fg2)}
.seg button.on{background:var(--fg);color:var(--bg)}
.stage{flex:1;min-height:0;position:relative;background:var(--bg)}

/* chart */
.chart{position:absolute;inset:0;overflow:hidden}
.chart svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.chart svg:active{cursor:grabbing}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wp{cursor:pointer}
.wp text{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.wp .lid{font-family:var(--font-m);font-size:10.5px;fill:var(--fg3);text-anchor:middle}
.wp .ln{font-size:13px;fill:var(--fg);text-anchor:middle;font-weight:600}
.wp.s-done .ln{fill:var(--fg2);font-weight:400}
.pulse{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.6s cubic-bezier(.22,1,.36,1) infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2);opacity:0}}
.rgt{font-family:var(--font-d);font-weight:800;font-size:26px;fill:var(--fg);letter-spacing:-.02em}
.rgs{font-family:var(--font-m);font-size:11px;fill:var(--fg3)}
.draw .road{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ink 1.2s cubic-bezier(.22,1,.36,1) forwards}
.draw .road.live,.draw .road.dashed{stroke-dasharray:none;stroke-dashoffset:0;opacity:0;animation:fadein .7s .5s forwards}
.draw .wp{opacity:0;animation:fadein .45s ease-out forwards;animation-delay:calc(var(--i)*40ms + 120ms)}
@keyframes ink{to{stroke-dashoffset:0}} @keyframes fadein{to{opacity:1}}
.legend{position:absolute;left:16px;bottom:14px;padding:6px 12px;font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 14px;max-width:calc(100% - 90px);background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:10px;height:10px;display:inline-block;border-radius:50%}
.zoom{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.zoom button{width:30px;height:30px;color:var(--fg2)} .zoom button:hover{background:var(--bg3)}

/* board */
.board{position:absolute;inset:0;overflow:auto;padding-bottom:30px}
.bgrid{display:grid;grid-template-columns:140px repeat(6,minmax(128px,1fr));min-width:920px;position:relative}
.bh{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 10px 8px;border-bottom:1px solid var(--line2);display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:700}
.bh .n{margin-left:auto;font-family:var(--font-m);font-size:10.5px;color:var(--fg3);font-weight:400}
.bh .sw{width:9px;height:9px;border-radius:50%;flex:none}
.lane{position:sticky;left:0;z-index:2;background:var(--bg2);padding:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.lane .n{font-weight:700;font-size:14px;line-height:1.2;display:flex;gap:7px;align-items:center;margin:3px 0}
.lane .mono{font-size:10.5px;color:var(--fg3)}
.lane .c{display:inline-block;margin-top:8px;font-family:var(--font-m);font-size:10.5px;padding:2px 6px;border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.cell{padding:9px 7px;border-bottom:1px solid var(--line);border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:7px;min-height:84px}
.tag{position:relative;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px 8px;cursor:pointer;transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s,opacity .18s}
.tag:hover{transform:translateY(-2px)}
.tag .i{display:flex;gap:6px;font-family:var(--font-m);font-size:10px;color:var(--fg3)}
.tag .i .a{margin-left:auto;color:var(--s-progress)}
.tag .nm{font-size:12.5px;font-weight:500;line-height:1.3;margin:2px 0 5px}
.tag .bl{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag.sel{box-shadow:0 0 0 2px var(--accent)}
.tag.mini{padding:4px 8px;border-style:dashed}
.tag.mini .nm{margin:0;font-size:11.5px;font-weight:400;color:var(--fg2);text-decoration:line-through}
.tag.fog{background:transparent;border-style:dashed;color:var(--fg2);font-size:12px}
.bgrid.hl .tag{opacity:.3} .bgrid.hl .tag.h0,.bgrid.hl .tag.h1,.bgrid.hl .tag.h2{opacity:1}
.bgrid.hl .tag.h1{box-shadow:0 0 0 2px var(--s-blocked)} .bgrid.hl .tag.h2{box-shadow:0 0 0 2px var(--s-ready)} .bgrid.hl .tag.h0{box-shadow:0 0 0 2px var(--fg)}
svg.threads{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible}
svg.threads path{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:ink .5s ease-out forwards}

/* ledger & sub-views */
.pane{position:absolute;inset:0;overflow:auto;padding:18px 24px 40px}
table.ledger{width:100%;border-collapse:collapse}
.ledger th{text-align:left;padding:7px 10px;border-bottom:2px solid var(--line2)}
.ledger td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger tr[data-t]{cursor:pointer} .ledger tr[data-t]:hover td{background:var(--bg2)} .ledger tr.sel td{background:var(--bg3)}
.ledger .id{font-family:var(--font-m);font-size:11px;color:var(--fg3)}
.manifest{display:grid;grid-template-columns:22px minmax(150px,220px) minmax(0,1fr) auto;gap:4px 14px;align-items:baseline}
.manifest > div{padding:9px 0;border-bottom:1px solid var(--line)}
.pane h2{font-family:var(--font-d);font-weight:800;font-size:26px;letter-spacing:-.015em;margin:0 0 4px}
.pane .lede{color:var(--fg2);margin:0 0 18px;max-width:70ch}
.pane h3{margin:26px 0 8px}
.lexicon{columns:2 300px;column-gap:36px}
.lexicon dl{break-inside:avoid;margin:0 0 14px}
.lexicon dt{font-weight:700;font-size:16px}
.lexicon dd{margin:2px 0 0;color:var(--fg2)}
.skills{display:flex;flex-wrap:wrap;gap:5px 12px;font-family:var(--font-m);font-size:12px}
.skills span{color:var(--fg2)} .skills span.u{color:var(--fg)}

/* atoms */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.who{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c)}
.cmd{display:inline-flex;align-items:center;font-family:var(--font-m);font-size:12px;padding:3px 8px;background:var(--bg3);border-radius:var(--r);color:var(--fg);white-space:nowrap}
.chip{font-family:var(--font-m);font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid var(--line2);cursor:pointer;background:var(--bg)}
.chip.open{border-color:var(--s-blocked);color:var(--s-blocked)}
.chip.closed{color:var(--fg3);text-decoration:line-through}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);font-size:12px;font-weight:600;color:var(--fg);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--bg3)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.go:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--fg2)} .btn.quiet:hover{color:var(--fg);background:var(--bg3)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* details (inspector) */
.notes{grid-area:notes;overflow:auto;padding:18px 18px 40px;transition:opacity .25s}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.notes h2{font-family:var(--font-d);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.01em;margin:10px 0 4px}
.notes .ref{font-family:var(--font-m);font-size:11px;color:var(--fg3)}
.notes .next{width:auto;margin:14px 0 4px}
.facts{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;font-size:12.5px;margin:14px 0}
.facts dt{color:var(--fg3)} .facts dd{margin:0;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.notes h6{margin:18px 0 6px}
.crit{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:12.5px}
.crit .bx{width:13px;height:13px;border:1.5px solid var(--fg3);border-radius:2px;flex:none;margin-top:3px;display:grid;place-items:center;font-size:10px;color:var(--s-done);font-weight:800}
.crit.y .bx{border-color:var(--s-done)} .crit.y span:last-child{color:var(--fg3);text-decoration:line-through}
.alt{display:flex;flex-direction:column;align-items:flex-start;gap:2px}

/* dock */
.dock{grid-area:dock;display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0;min-width:0}
.exp{padding:10px 16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}
.exp .hd{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.exp .hd b{font-family:var(--font-d);font-size:15px;font-weight:800}
.exp .row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;flex:1;min-height:0}
.ship{flex:none;width:228px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .2s}
.ship:hover{border-color:var(--line2)}
.ship.on{border-color:var(--fg)}
.ship .t{display:flex;gap:7px;align-items:center;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship .d{font-family:var(--font-m);font-size:10.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship .k{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3);margin-top:auto;gap:6px}
.sd{width:8px;height:8px;border-radius:50%;flex:none}
.sd.running{background:var(--s-progress);animation:breathe 1.6s infinite} .sd.waiting{background:var(--s-you)} .sd.done{background:var(--s-done)}
.fuel{height:5px;background:var(--bg3);border-radius:3px;position:relative;margin-top:7px}
.fuel i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.fuel b{position:absolute;top:-3px;bottom:-3px;left:75%;width:1.5px;background:var(--fg2)}
.ship.add{align-items:center;justify-content:center;border-style:dashed;color:var(--fg2);width:140px}
.disp{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.disp .tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.disp .tabs button{padding:5px 10px;font-size:12px;color:var(--fg2);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.disp .tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.disp .body{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.q{padding:9px 11px;background:var(--bg);border:1px solid var(--s-you);border-radius:var(--r)}
.q .from{font-size:11px;color:var(--fg3);display:flex;gap:8px;align-items:center}
.q .qq{font-weight:700;margin:3px 0 4px;line-height:1.35}
.q .rec{font-size:12px;color:var(--fg2);padding-left:9px;border-left:2px solid var(--s-you);margin-bottom:7px}
.q .acts{margin-top:0}
.msg{max-width:88%;padding:6px 10px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);font-size:12.5px}
.msg .w{font-size:10.5px;color:var(--fg3)}
.msg.me{align-self:flex-end;background:var(--bg3)}
.compose{display:flex;gap:6px;padding:8px 12px 10px;border-top:1px solid var(--line)}
.compose select,.compose input{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:5px 8px;font-size:12px;color:var(--fg)}
.compose select{max-width:120px}
.compose input{flex:1;min-width:0}
.empty{color:var(--fg3);text-align:center;padding:14px}

.scrim{position:fixed;inset:0;background:color-mix(in oklch,var(--fg) 22%,transparent);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fadein .15s forwards;opacity:0}
.palette{width:600px;max-height:60vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 24px 70px color-mix(in oklch,var(--fg) 25%,transparent);overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font-size:16px;outline:none}
.palette .list{overflow:auto;padding:6px}
.palette .it{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r);cursor:pointer}
.palette .it.on{background:var(--bg3)}
.palette .it .ty{width:64px}
.palette .it .r{margin-left:auto;font-family:var(--font-m);font-size:11px;color:var(--fg3)}
#toast{position:fixed;right:18px;bottom:90px;z-index:70;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#toast div{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:var(--r);font-size:12px;animation:slip .35s cubic-bezier(.22,1,.36,1)}
#toast b{font-family:var(--font-m);font-weight:500}
@keyframes slip{from{opacity:0;transform:translateY(8px)}}

    <aside class="notes">${notesHTML()}</aside>
    <footer class="dock">${dockHTML()}</footer></div>${S.pal != null ? paletteHTML() : ''}${S.themeOpen ? pickerHTML() : ''}`;
  document.getElementById('switcher').innerHTML = `<button data-sw="-1" title="Previous theme (Alt+←)">‹</button><div class="dots">${TK.map(k => `<a href="?variant=${k}" class="${k === V ? 'on' : ''}" data-go="${k}">${k}</a>`).join('')}</div><div class="l">${V} · ${THEMES[V][0]}<small>${THEMES[V][1]}</small></div><button data-sw="1" title="Next theme (Alt+→)">›</button>`;
  S.boot = false;
  if (document.getElementById('chartsvg')) wireChart();
  if (S.pal != null){ const i = document.getElementById('palIn'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

/* ======================= ACTIONS ======================= */
function toast(h){ const d = document.createElement('div'); d.innerHTML = h; document.getElementById('toast').appendChild(d); setTimeout(() => d.remove(), 2800); }
function send(cmd){ SESSIONS.find(s => s.id === 'main').log.push({w:'me', t:cmd}); toast(`Sent <b>${esc(cmd)}</b> to the main session`); }
function selectEff(id){ const e = effById(id); S.eff = id; S.scope = 'effort'; if (!['chart','board','ledger'].includes(S.view)) S.view = 'chart'; if (!findT(S.t)[1] || findT(S.t)[1].id !== id) S.t = e.tickets.find(t => ['ready','you','progress'].includes(stateOf(t, e)))?.id || e.tickets[0]?.id || null; }
function goTheme(k, save){ V = k; if (save) writeOverride(k); history.replaceState(null, '', location.pathname); S.vb = null; S.boot = true; S.drawn.clear(); render(); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-pick],[data-go],[data-sw],[data-act],[data-v],[data-scope],[data-eff],[data-t],[data-view],[data-sess],[data-dtab],[data-z],[data-pi]'); if (!el) return;
  const d = el.dataset, a = d.act;
  if (d.pick){ return goTheme(d.pick, true); }
  if (a === 'theme'){ S.themeOpen = !S.themeOpen; return render(); }
  if (a === 'themereset'){ writeOverride(null); return goTheme(INSTALL_DEFAULT); }
  if (S.themeOpen && !ev.target.closest('.tpick')){ S.themeOpen = false; render(); }
  if (d.go){ ev.preventDefault(); return goTheme(d.go); }
  if (d.sw){ return goTheme(TK[(TK.indexOf(V) + +d.sw + TK.length) % TK.length]); }
  if (d.pi != null){ S.palItems[+d.pi].go(); S.pal = null; return render(); }
  if (d.z){ if (d.z === 'fit') S.vb = null; else { const f = +d.z, cx = S.vb.x + S.vb.w / 2, cy = S.vb.y + S.vb.h / 2; S.vb.w *= f; S.vb.h *= f; S.vb.x = cx - S.vb.w / 2; S.vb.y = cy - S.vb.h / 2; } return render(); }
  if (a === 'pal'){ S.pal = ''; S.palI = 0; return render(); }
  if (a === 'palclose'){ if (ev.target === el){ S.pal = null; render(); } return; }
  if (a === 'wide'){ S.wide = !S.wide; return render(); }
  if (a === 'atlas'){ S.scope = 'atlas'; if (!['chart','board'].includes(S.view)) S.view = 'chart'; return render(); }
  if (a === 'awaits'){ S.dtab = 'q'; return render(); }
  if (a === 'copy'){ navigator.clipboard?.writeText(d.cmd).catch(() => {}); return toast(`Copied <b>${esc(d.cmd)}</b>`); }
  if (a === 'send'){ send(d.cmd); return render(); }
  if (a === 'spawn'){
    const tid = d.t, id = tid ? (findT(tid)[1]?.kind === 'map' ? 'res-' : 'impl-') + tid.slice(1) : 'bg-' + (SESSIONS.length + 1);
    if (tid){ const [t, e] = findT(tid); if (t){ t.status = 'progress'; t.agent = id; if (e.kind === 'spec') t.worktree = 'wt/' + tid.slice(1) + '-' + t.title.toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '').slice(0, 20); } }
    SESSIONS.push({id, name: tid ? findT(tid)[0]?.title || d.cmd : 'New session', kind:'bg', st:'running', ctx:3, doing:d.cmd, log:[{w:'agent', t:`Started with context pointers only: ${d.cmd}.`}]});
    S.sess = id; S.dtab = 't'; toast(`Spawned <b>${id}</b> · claude --bg --name "${esc(d.cmd)}"`); return render(); }
  if (a === 'answer'){ const q = QUESTIONS.find(x => x.id === d.q); QUESTIONS = QUESTIONS.filter(x => x.id !== d.q); const s = SESSIONS.find(x => x.id === q.from);
    s.log.push({w:'me', t: d.a === '__rec' ? 'Agreed: ' + q.rec : d.a}); if (s.st === 'waiting') s.st = 'running'; toast(`Answer sent to <b>${q.from}</b>`); return render(); }
  if (a === 'reply'){ S.sess = d.s; S.dtab = 't'; render(); document.getElementById('msgIn')?.focus(); return; }
  if (a === 'msg'){ const inp = document.getElementById('msgIn'), txt = inp?.value.trim(); if (!txt) return; const tgt = document.getElementById('tgt').value;
    if (tgt === '__new'){ SESSIONS.push({id:'sub-' + (SESSIONS.length + 1), name:txt.slice(0, 40), kind:'sub', st:'running', ctx:2, doing:txt, log:[{w:'me', t:txt}]}); toast('New subagent started'); }
    else { SESSIONS.find(s => s.id === tgt).log.push({w:'me', t:txt}); S.sess = tgt; S.dtab = 't'; toast(`Sent to <b>${tgt}</b>`); } return render(); }
  if (a === 'watch'){ S.sess = d.s; S.dtab = 't'; return render(); }
  if (d.v){ S.view = d.v; return render(); }
  if (d.scope){ S.scope = d.scope; if (S.scope === 'atlas' && S.view === 'ledger') S.view = 'chart'; return render(); }
  if (d.dtab){ S.dtab = d.dtab; return render(); }
  if (d.sess){ S.sess = d.sess; S.dtab = 't'; return render(); }
  if (d.view){ S.view = d.view; return render(); }
  if (d.eff){ selectEff(d.eff); return render(); }
  if (d.t){ const [t, e] = findT(d.t); if (!t) return; S.t = d.t; if (S.scope === 'effort') S.eff = e.id; if (!['chart','board','ledger'].includes(S.view)){ S.view = 'chart'; S.eff = e.id; S.scope = 'effort'; } S.wide = false; return render(); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'palIn'){ S.pal = ev.target.value; S.palI = 0; render(); } });
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); S.pal = S.pal == null ? '' : null; S.palI = 0; return render(); }
  if (S.pal != null){
    if (ev.key === 'Escape'){ S.pal = null; return render(); }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){ ev.preventDefault(); S.palI = Math.max(0, Math.min((S.palItems || []).length - 1, S.palI + (ev.key === 'ArrowDown' ? 1 : -1))); return render(); }
    if (ev.key === 'Enter' && S.palItems?.[S.palI]){ S.palItems[S.palI].go(); S.pal = null; return render(); }
    return;
  }
  if (ev.target.closest('input,textarea,select')){ if (ev.key === 'Enter' && ev.target.id === 'msgIn'){ ev.preventDefault(); document.querySelector('[data-act="msg"]').click(); } return; }
  if (ev.altKey && ev.key === 'ArrowRight') return goTheme(TK[(TK.indexOf(V) + 1) % TK.length], true);
  if (ev.altKey && ev.key === 'ArrowLeft') return goTheme(TK[(TK.indexOf(V) + TK.length - 1) % TK.length], true);
  if (ev.key === 'Escape' && S.themeOpen){ S.themeOpen = false; return render(); }
  if (ev.key === '1'){ S.view = 'chart'; render(); } if (ev.key === '2'){ S.view = 'board'; render(); } if (ev.key === '3' && S.scope === 'effort'){ S.view = 'ledger'; render(); }
  if (ev.key === ']'){ S.wide = !S.wide; render(); }
  if (ev.key === 'Escape'){ S.t = null; render(); }
});
/* board: hover draws threads from blockers (red) and to dependents (blue) */
document.addEventListener('mouseover', ev => {
  const grid = document.getElementById('bgrid'); if (!grid) return;
  const tag = ev.target.closest('.tag[data-t]'), id = tag?.dataset.t || null;
  if (id === (grid.dataset.hl || null)) return; grid.dataset.hl = id || '';
  const svg = document.getElementById('threads'); svg.innerHTML = ''; grid.classList.toggle('hl', !!id);
  grid.querySelectorAll('.tag').forEach(x => x.classList.remove('h0','h1','h2')); if (!id) return;
  const [t, e] = findT(id), g = grid.getBoundingClientRect(); svg.setAttribute('width', grid.scrollWidth); svg.setAttribute('height', grid.scrollHeight);
  const box = x => { const r = x.getBoundingClientRect(); return {l:r.left - g.left, r:r.right - g.left, y:r.top - g.top + r.height / 2}; };
  const me = box(tag); tag.classList.add('h0'); let p = '';
  grid.querySelectorAll('.tag[data-t]').forEach(x => { const k = x.dataset.t, isB = t.blockedBy.includes(k), isD = dependents(t, e).some(z => z.id === k); if (!isB && !isD) return;
    x.classList.add(isB ? 'h1' : 'h2'); const o = box(x);
    const [a, b] = isB ? [o, me] : [me, o], fwd = (a.l + a.r) <= (b.l + b.r), x1 = fwd ? a.r : a.l, x2 = fwd ? b.l : b.r, sg = fwd ? 1 : -1, dx = Math.max(40, Math.abs(x2 - x1) / 2), c = isB ? 'var(--s-blocked)' : 'var(--s-ready)';
    p += `<path stroke="${c}" d="M${x1},${a.y} C${x1 + sg * dx},${a.y} ${x2 - sg * dx},${b.y} ${x2},${b.y}"/><circle cx="${x2}" cy="${b.y}" r="3.5" fill="${c}"/>`; });
  svg.innerHTML = p;
});
function wireChart(){
  const s = document.getElementById('chartsvg'); let drag = null;
  const set = () => s.setAttribute('viewBox', `${S.vb.x} ${S.vb.y} ${S.vb.w} ${S.vb.h}`);
  if (S.vbFresh){ S.vbFresh = false; const r = s.getBoundingClientRect(), kk = Math.max(S.vb.w / r.width, S.vb.h / r.height), cap = S.scope === 'atlas' ? 99 : 1.15;
    if (kk > cap){ const cy = S.vb.y + S.vb.h / 2; S.vb.w = r.width * cap; S.vb.h = r.height * cap; S.vb.y = cy - S.vb.h / 2; S.vb.x -= 10; }
    else if (kk < .85){ const cx = S.vb.x + S.vb.w / 2, cy = S.vb.y + S.vb.h / 2; S.vb.w = r.width * .85; S.vb.h = r.height * .85; S.vb.x = cx - S.vb.w / 2; S.vb.y = cy - S.vb.h / 2; }
    set(); }
  const k = () => { const r = s.getBoundingClientRect(); return Math.max(S.vb.w / r.width, S.vb.h / r.height); };
  s.addEventListener('pointerdown', e => { if (e.target.closest('[data-t],[data-eff],[data-view]')) return; drag = {x:e.clientX, y:e.clientY, vx:S.vb.x, vy:S.vb.y, k:k()}; s.setPointerCapture(e.pointerId); });
  s.addEventListener('pointermove', e => { if (!drag) return; S.vb.x = drag.vx - (e.clientX - drag.x) * drag.k; S.vb.y = drag.vy - (e.clientY - drag.y) * drag.k; set(); });
  s.addEventListener('pointerup', () => drag = null);
  s.addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY > 0 ? 1.08 : .926, r = s.getBoundingClientRect(), kk = k();
    const mx = S.vb.x + S.vb.w / 2 + (e.clientX - r.left - r.width / 2) * kk, my = S.vb.y + S.vb.h / 2 + (e.clientY - r.top - r.height / 2) * kk;
    S.vb.x = mx - (mx - S.vb.x) * f; S.vb.y = my - (my - S.vb.y) * f; S.vb.w *= f; S.vb.h *= f; set(); }, {passive:false});
}
render();
</script>
